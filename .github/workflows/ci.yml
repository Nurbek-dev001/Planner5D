name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: spaceplan
          POSTGRES_PASSWORD: spaceplan
          POSTGRES_DB: spaceplan_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U spaceplan"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://spaceplan:spaceplan@localhost:5432/spaceplan_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Build web
        run: npm run build
