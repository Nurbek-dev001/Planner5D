services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: spaceplan
      POSTGRES_PASSWORD: spaceplan
      POSTGRES_DB: spaceplan
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./apps/api/docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro

volumes:
  pgdata:
